[project]
name = "dev-playbook-sdd-tools"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
sdd-chain-text = "sdd_chain_text.cli:main"

[project.entry-points.pytest11]
pytest-sdd = "pytest_sdd.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_sdd", "src/sdd_chain_text"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "SLF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["pytest_sdd", "sdd_chain_text"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
disable_error_code = ["import-untyped"]

<title>File Graph — dev-playbook</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a22; --panel2: #1e222c; --edge: #2a2f3a;
    --text: #e6e8ee; --muted: #9aa2b1; --dim: #6b7280;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  #stage { position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #side { background: var(--panel); border-left: 1px solid var(--edge);
    overflow-y: auto; padding: 16px; }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .panel { background: var(--panel2); border: 1px solid var(--edge); border-radius: 8px;
    padding: 11px 12px; margin-bottom: 12px; }
  .panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); margin: 0 0 9px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; cursor: default; }
  .row.click { cursor: pointer; }
  .row.off { opacity: .32; }
  .sw { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 auto; }
  .row .name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .num { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 3px; margin-top: 2px; }
  .toggle { display: flex; gap: 6px; margin-bottom: 12px; }
  .toggle button { flex: 1; background: var(--panel2); color: var(--muted);
    border: 1px solid var(--edge); border-radius: 6px; padding: 7px 6px; cursor: pointer;
    font-size: 12px; }
  .toggle button.on { background: #2d3550; color: #fff; border-color: #3d4a6e; }
  .big { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .big .u { font-size: 12px; color: var(--muted); font-weight: 400; }
  .kv { display: flex; justify-content: space-between; margin: 2px 0; }
  .kv .k { color: var(--muted); }
  .defect { font-size: 11px; margin: 4px 0; }
  .defect .st { display: inline-block; font-size: 10px; padding: 0 5px; border-radius: 3px;
    margin-right: 5px; vertical-align: 1px; }
  .st.broken { background: #7f1d1d; color: #fecaca; }
  .st.wrong-form { background: #78350f; color: #fde68a; }
  .defect .p { color: var(--muted); word-break: break-all; }
  #hud { position: absolute; left: 12px; top: 12px; background: rgba(23,26,34,.92);
    border: 1px solid var(--edge); border-radius: 8px; padding: 9px 11px; max-width: 62%;
    pointer-events: none; font-size: 12px; backdrop-filter: blur(4px); }
  #hud .path { font-weight: 600; word-break: break-all; }
  #hud .meta { color: var(--muted); margin-top: 3px; }
  #hud.hidden { display: none; }
  .hint { position: absolute; right: 12px; bottom: 10px; color: var(--dim); font-size: 11px;
    pointer-events: none; }
</style>

<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud" class="hidden"></div>
    <div class="hint">drag nodes · hover to trace · scroll panel for detail</div>
  </div>
  <div id="side">
    <h1>File Graph</h1>
    <div class="sub" id="subline"></div>

    <div class="toggle">
      <button id="mBucket" class="on">Color by bucket</button>
      <button id="mReach">Reach from CLAUDE.md</button>
    </div>

    <div class="panel">
      <h2>Reachability from harness context</h2>
      <div class="big" id="reachBig"></div>
      <div id="rings"></div>
    </div>

    <div class="panel">
      <h2>Nodes by bucket</h2>
      <div id="buckets"></div>
    </div>

    <div class="panel">
      <h2>Edges</h2>
      <div id="edgeForms"></div>
      <div style="height:8px"></div>
      <div id="edgeStatus"></div>
    </div>

    <div class="panel">
      <h2 id="orphanHdr">Orphans</h2>
      <div id="orphans"></div>
    </div>

    <div class="panel">
      <h2 id="defectHdr">Defects</h2>
      <div id="defects"></div>
    </div>

    <div class="panel">
      <h2>Components (concept + index)</h2>
      <div id="components"></div>
    </div>
  </div>
</div>

<script>
const DATA = __DATA__;

const BUCKET_COLOR = {
  "concept": "#6366f1",
  "index": "#a855f7",
  "harness-session": "#ef4444",
  "harness-skill-authored": "#f59e0b",
  "harness-skill-thirdparty": "#14b8a6",
  "code": "#3b82f6",
  "config": "#22c55e",
  "unclassified": "#ec4899",
};
const BUCKET_ORDER = ["harness-session","harness-skill-authored","harness-skill-thirdparty",
  "concept","index","code","config","unclassified"];
// reach distance -> color (hot near seeds, cool far), unreached = dim slate
const DIST_COLOR = ["#f43f5e","#fb7185","#fb923c","#fbbf24","#a3e635","#34d399","#22d3ee"];
const UNREACHED = "#3a4150";

const reach = DATA.queries.reachability;
const reached = reach.reached;                 // {path: dist}
const seeds = new Set(reach.seeds);
const orphans = DATA.queries.orphans;          // {path: bucket}

// ---- build node + link arrays ----
const nodes = Object.entries(DATA.nodes).map(([path, bucket], i) => ({
  path, bucket, i, dist: (path in reached ? reached[path] : null),
  seed: seeds.has(path), deg: 0,
  x: Math.cos(i) * 240 + 400 + (i % 7) * 3,
  y: Math.sin(i * 1.3) * 240 + 300 + (i % 5) * 3,
  vx: 0, vy: 0, fx: null, fy: null,
}));
const byPath = new Map(nodes.map(n => [n.path, n]));

const links = [];
for (const e of DATA.edges) {
  const s = byPath.get(e.source), t = byPath.get(e.target);
  if (s && t && s !== t) {
    links.push({ s, t, form: e.form, status: e.status });
    s.deg++; t.deg++;
  }
}
const nbr = new Map(nodes.map(n => [n, new Set()]));
for (const l of links) { nbr.get(l.s).add(l.t); nbr.get(l.t).add(l.s); }
for (const n of nodes) n.r = 3 + Math.sqrt(n.deg) * 1.25;

// ---- canvas + hidpi ----
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize() {
  const st = document.getElementById("stage").getBoundingClientRect();
  W = st.width; H = st.height;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize); resize();

// ---- force sim (cooling alpha + friction + velocity clamp, then freeze) ----
const CHARGE = 700, LINK_K = 0.08, LINK_LEN = 30, CENTER_K = 0.015;
const FRICTION = 0.6, MAXV = 12, ALPHA_DECAY = 0.022, ALPHA_FREEZE = 0.004;
let alpha = 1;
function reheat(a = 0.4) { if (alpha < a) alpha = a; }
function tick() {
  alpha += (0 - alpha) * ALPHA_DECAY;   // exponential cool toward 0
  const cx = W / 2, cy = H / 2, N = nodes.length;
  for (let a = 0; a < N; a++) {
    const na = nodes[a];
    for (let b = a + 1; b < N; b++) {
      const nb = nodes[b];
      let dx = na.x - nb.x, dy = na.y - nb.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 0.01) { dx = (a - b) * 0.1 + 0.01; dy = 0.03; d2 = dx * dx + dy * dy; }
      const d = Math.sqrt(d2), f = (CHARGE * alpha) / d2;
      const fx = (dx / d) * f, fy = (dy / d) * f;
      na.vx += fx; na.vy += fy; nb.vx -= fx; nb.vy -= fy;
    }
  }
  for (const l of links) {
    const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
    const f = LINK_K * (d - LINK_LEN) * alpha;
    const fx = (dx / d) * f, fy = (dy / d) * f;
    l.s.vx += fx; l.s.vy += fy; l.t.vx -= fx; l.t.vy -= fy;
  }
  for (const n of nodes) {
    if (n.fx != null) { n.x = n.fx; n.y = n.fy; n.vx = n.vy = 0; continue; }
    n.vx += (cx - n.x) * CENTER_K * alpha;
    n.vy += (cy - n.y) * CENTER_K * alpha;
    const v = Math.sqrt(n.vx * n.vx + n.vy * n.vy);
    if (v > MAXV) { n.vx = (n.vx / v) * MAXV; n.vy = (n.vy / v) * MAXV; }
    n.x += n.vx; n.y += n.vy;
    n.vx *= FRICTION; n.vy *= FRICTION;
  }
}

// ---- render ----
let mode = "bucket";
let hover = null;
function nodeColor(n) {
  if (mode === "reach") return n.dist == null ? UNREACHED : DIST_COLOR[Math.min(n.dist, 6)];
  return dimmed.has(n.bucket) ? UNREACHED : (BUCKET_COLOR[n.bucket] || "#888");
}
const dimmed = new Set();   // buckets toggled off in legend

function draw() {
  ctx.clearRect(0, 0, W, H);
  const active = hover ? nbr.get(hover) : null;
  // edges
  for (const l of links) {
    const lit = hover && (l.s === hover || l.t === hover);
    if (l.status !== "ok") { ctx.strokeStyle = l.status === "broken" ? "rgba(244,63,94,.55)" : "rgba(245,158,11,.5)"; }
    else ctx.strokeStyle = lit ? "rgba(210,220,240,.85)" : "rgba(120,130,150,.10)";
    ctx.lineWidth = lit ? 1.4 : 0.7;
    ctx.beginPath(); ctx.moveTo(l.s.x, l.s.y); ctx.lineTo(l.t.x, l.t.y); ctx.stroke();
  }
  // nodes
  for (const n of nodes) {
    const faded = hover && n !== hover && !(active && active.has(n));
    ctx.globalAlpha = faded ? 0.22 : 1;
    ctx.fillStyle = nodeColor(n);
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 6.2832); ctx.fill();
    if (n.seed) {
      ctx.globalAlpha = faded ? 0.3 : 1;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 2.5, 0, 6.2832); ctx.stroke();
    }
    if (n === hover) {
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 3, 0, 6.2832); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
function frame() { if (alpha > ALPHA_FREEZE) tick(); draw(); requestAnimationFrame(frame); }
// settle the layout before the first paint, then freeze; interaction re-heats it
for (let i = 0; i < 320; i++) tick();
alpha = 0;
frame();

// ---- interaction ----
function pick(mx, my) {
  let best = null, bestD = Infinity;
  for (const n of nodes) {
    const dx = n.x - mx, dy = n.y - my, d = Math.sqrt(dx * dx + dy * dy);
    if (d < n.r + 5 && d < bestD) { best = n; bestD = d; }
  }
  return best;
}
let drag = null;
canvas.addEventListener("mousemove", (e) => {
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  if (drag) { drag.fx = mx; drag.fy = my; reheat(0.3); return; }
  hover = pick(mx, my);
  const hud = document.getElementById("hud");
  if (hover) {
    hud.classList.remove("hidden");
    const dtxt = hover.dist == null ? "unreachable from CLAUDE.md"
      : (hover.dist === 0 ? "seed (harness context)" : hover.dist + " hop" + (hover.dist>1?"s":"") + " from CLAUDE.md");
    hud.innerHTML = `<div class="path">${hover.path}</div>`
      + `<div class="meta">${hover.bucket} &middot; ${hover.deg} edge${hover.deg===1?"":"s"} &middot; ${dtxt}</div>`;
  } else hud.classList.add("hidden");
});
canvas.addEventListener("mousedown", (e) => {
  const r = canvas.getBoundingClientRect();
  drag = pick(e.clientX - r.left, e.clientY - r.top);
  if (drag) { drag.fx = drag.x; drag.fy = drag.y; reheat(0.3); }
});
window.addEventListener("mouseup", () => { if (drag) { drag.fx = drag.fy = null; drag = null; } });

// ---- mode buttons ----
const mB = document.getElementById("mBucket"), mR = document.getElementById("mReach");
mB.onclick = () => { mode = "bucket"; mB.classList.add("on"); mR.classList.remove("on"); };
mR.onclick = () => { mode = "reach"; mR.classList.add("on"); mB.classList.remove("on"); };

// ---- sidebar population ----
const census = DATA.queries.census;
const nb = census.nodes_by_bucket;
const total = nodes.length, nreached = Object.keys(reached).length;
document.getElementById("subline").textContent =
  `${DATA.repo} · ${total} files · ${links.length} internal edges · ${DATA.queries.defects.length} defects`;

document.getElementById("reachBig").innerHTML =
  `${nreached}<span class="u"> / ${total} reached</span> &nbsp; `
  + `<span class="big" style="color:var(--muted)">${reach.unreached.length}<span class="u"> unreachable</span></span>`;

const rbd = reach.reached_by_distance;
const maxRing = Math.max(...Object.values(rbd), reach.unreached.length);
let ringsHtml = "";
for (let d = 0; d <= 6; d++) {
  const c = rbd[d] || 0; if (!c && d > 0) continue;
  ringsHtml += `<div class="row"><span class="sw" style="background:${DIST_COLOR[d]}"></span>`
    + `<span class="name">${d === 0 ? "seeds" : d + " hop" + (d>1?"s":"")}</span>`
    + `<span class="num">${c}</span></div>`
    + `<div class="bar" style="width:${Math.max(4, c/maxRing*100)}%;background:${DIST_COLOR[d]}"></div>`;
}
ringsHtml += `<div class="row" style="margin-top:8px"><span class="sw" style="background:${UNREACHED}"></span>`
  + `<span class="name">unreachable</span><span class="num">${reach.unreached.length}</span></div>`
  + `<div class="bar" style="width:${reach.unreached.length/maxRing*100}%;background:${UNREACHED}"></div>`;
// unreached breakdown
const ubb = reach.unreached_by_bucket;
ringsHtml += `<div style="margin-top:7px;color:var(--muted);font-size:11px">unreachable: `
  + BUCKET_ORDER.filter(b => ubb[b]).map(b => `${ubb[b]}&nbsp;${b.replace("harness-","")}`).join(" · ") + `</div>`;
document.getElementById("rings").innerHTML = ringsHtml;

let bh = "";
for (const b of BUCKET_ORDER) {
  if (!nb[b]) continue;
  bh += `<div class="row click" data-b="${b}"><span class="sw" style="background:${BUCKET_COLOR[b]}"></span>`
    + `<span class="name">${b}</span><span class="num">${nb[b]}</span></div>`;
}
const bucketsEl = document.getElementById("buckets");
bucketsEl.innerHTML = bh;
bucketsEl.querySelectorAll(".row").forEach(row => {
  row.onclick = () => {
    const b = row.dataset.b;
    if (dimmed.has(b)) { dimmed.delete(b); row.classList.remove("off"); }
    else { dimmed.add(b); row.classList.add("off"); }
  };
});

document.getElementById("edgeForms").innerHTML = Object.entries(census.edges_by_form)
  .sort((a,b) => b[1]-a[1])
  .map(([f,c]) => `<div class="kv"><span class="k">${f}</span><span>${c}</span></div>`).join("");
document.getElementById("edgeStatus").innerHTML = Object.entries(census.edges_by_status)
  .map(([s,c]) => `<div class="kv"><span class="k" style="color:${s==='ok'?'#22c55e':s==='broken'?'#f43f5e':'#f59e0b'}">${s}</span><span>${c}</span></div>`).join("");

const orphanCounts = {};
for (const b of Object.values(orphans)) orphanCounts[b] = (orphanCounts[b] || 0) + 1;
document.getElementById("orphanHdr").textContent = `Orphans (${Object.keys(orphans).length})`;
document.getElementById("orphans").innerHTML = BUCKET_ORDER.filter(b => orphanCounts[b])
  .map(b => `<div class="row"><span class="sw" style="background:${BUCKET_COLOR[b]}"></span>`
    + `<span class="name">${b}</span><span class="num">${orphanCounts[b]}</span></div>`).join("")
  + `<div style="color:var(--dim);font-size:11px;margin-top:6px">files with no edges at all</div>`;

const defects = DATA.queries.defects;
document.getElementById("defectHdr").textContent = `Defects (${defects.length})`;
document.getElementById("defects").innerHTML = defects.map(d =>
  `<div class="defect"><span class="st ${d.status}">${d.status}</span>`
  + `<span class="p">${d.source} → ${d.target}</span></div>`).join("");

const comps = DATA.queries.components;
document.getElementById("components").innerHTML =
  `<div class="big">${comps.length}<span class="u"> component${comps.length===1?"":"s"} · ${comps.reduce((a,c)=>a+c.length,0)} docs</span></div>`
  + `<div style="color:var(--dim);font-size:11px;margin-top:4px">`
  + (comps.length === 1 ? "the whole concept+index bundle is one connected web" : "sizes: " + comps.map(c=>c.length).sort((a,b)=>b-a).join(", "))
  + `</div>`;
</script>

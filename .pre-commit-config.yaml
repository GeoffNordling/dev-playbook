# dev-playbook runs its own hooks from the working tree, so edits to the
# scripts/ hooks are testable in place before release. Consumer repos do
# NOT use this file — they reference the published manifest (.pre-commit-hooks.yaml)
# by URL + pinned rev. The local block below therefore mirrors that manifest;
# keep the two in sync. See standards/build/distribution.md.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
        exclude: 'dotfiles/\.(agents|dhub)/'
      - id: ruff-format
        exclude: 'dotfiles/\.(agents|dhub)/'

  - repo: local
    hooks:
      - id: python-lint
        name: python-lint
        entry: scripts/python-lint
        language: script
        pass_filenames: false
        always_run: true

      - id: ref-check
        name: ref-check
        entry: scripts/ref-check
        language: script
        pass_filenames: false
        types: [markdown]

      - id: okf-lint
        name: okf-lint
        entry: scripts/okf-lint
        language: script
        pass_filenames: false
        always_run: true

      - id: internal-skill-audit
        name: internal-skill-audit
        entry: scripts/internal-skill-audit
        language: script
        pass_filenames: false
        always_run: true

      - id: judgments-lint
        name: judgments-lint
        entry: scripts/judgments-lint
        language: script
        pass_filenames: false
        always_run: true

      # Local-only: consumers have no hook manifest to validate.
      - id: validate-manifest
        name: validate-manifest
        entry: uvx pre-commit validate-manifest
        language: system
        files: ^\.pre-commit-hooks\.yaml$

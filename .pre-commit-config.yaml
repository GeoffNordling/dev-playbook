# dev-playbook runs its own hooks from the working tree, so edits to the
# tools/bin/ scripts are testable in place before release. Consumer repos do
# NOT use this file — they reference the published manifest (.pre-commit-hooks.yaml)
# by URL + pinned rev. The local block below therefore mirrors that manifest;
# keep the two in sync. See standards/build-conventions.md.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
        exclude: 'dotfiles/\.(agents|dhub)/'
      - id: ruff-format
        exclude: 'dotfiles/\.(agents|dhub)/'

  - repo: local
    hooks:
      - id: no-future-annotations
        name: no-future-annotations
        entry: tools/bin/no-future-annotations
        language: script
        pass_filenames: false
        always_run: true

      - id: ref-check
        name: ref-check
        entry: tools/bin/ref-check
        language: script
        pass_filenames: false
        types: [markdown]

      - id: test-privacy
        name: test-privacy
        entry: tools/bin/test-privacy
        language: script
        pass_filenames: false
        always_run: true

      - id: internal-skill-audit
        name: internal-skill-audit
        entry: tools/bin/internal-skill-audit
        language: script
        pass_filenames: false
        always_run: true

      - id: judgments-lint
        name: judgments-lint
        entry: tools/bin/judgments-lint
        language: script
        pass_filenames: false
        always_run: true

# dev-playbook runs its own hooks from the working tree, so edits to the
# scripts/ hooks are testable in place before release. Consumer repos do NOT
# use this file — they reference the published manifest (.pre-commit-hooks.yaml)
# by URL + pinned rev. dev-playbook is the hook repo itself, so the canonical
# template's pinned dev-playbook block is replaced here by the `- repo: local`
# dogfood block below; it mirrors that manifest, so keep the two in sync.
# See standards/build/distribution.md.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/maxwinterstein/shfmt-py
    rev: v4.0.0
    hooks:
      - id: shfmt
  - repo: local
    hooks:
      - id: make-check
        name: make check
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: repo-audit
        name: repo-audit
        entry: scripts/repo-audit
        language: script
        pass_filenames: false
        always_run: true

      - id: python-audit
        name: python-audit
        entry: scripts/python-audit
        language: script
        pass_filenames: false
        always_run: true

      - id: ref-audit
        name: ref-audit
        entry: scripts/ref-audit
        language: script
        pass_filenames: false
        types: [markdown]

      - id: okf-audit
        name: okf-audit
        entry: scripts/okf-audit
        language: script
        pass_filenames: false
        always_run: true

      - id: skill-audit
        name: skill-audit
        entry: scripts/skill-audit
        language: script
        pass_filenames: false
        always_run: true

      - id: judgments-audit
        name: judgments-audit
        entry: scripts/judgments-audit
        language: script
        pass_filenames: false
        always_run: true

      # Local-only: consumers have no hook manifest to validate.
      - id: validate-manifest
        name: validate-manifest
        entry: uvx pre-commit validate-manifest
        language: system
        files: ^\.pre-commit-hooks\.yaml$

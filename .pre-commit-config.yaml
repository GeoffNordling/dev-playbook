# dev-playbook runs its own hooks from the working tree, so edits to the
# scripts/ hooks are testable in place before release. Consumer repos do NOT
# use this file — they reference the published manifest (.pre-commit-hooks.yaml)
# by URL + pinned rev. dev-playbook is the hook repo itself, so the canonical
# template's pinned dev-playbook block is replaced here by the `- repo: local`
# dogfood block below; it mirrors that manifest, so keep the two in sync.
# See standards/build/distribution.md.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/maxwinterstein/shfmt-py
    rev: v4.0.0
    hooks:
      - id: shfmt
  - repo: local
    hooks:
      - id: make-check
        name: make check-judgments
        entry: make check-judgments
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: repo-lint
        name: repo-lint
        entry: scripts/repo-lint
        language: script
        pass_filenames: false
        always_run: true

      - id: python-lint
        name: python-lint
        entry: scripts/python-lint
        language: script
        pass_filenames: false
        always_run: true

      - id: testing-lint
        name: testing-lint
        entry: scripts/testing-lint
        language: script
        pass_filenames: false
        always_run: true

      - id: ref-lint
        name: ref-lint
        entry: scripts/ref-lint
        language: script
        pass_filenames: false
        types: [markdown]

      - id: okf-lint
        name: okf-lint
        entry: scripts/okf-lint
        language: script
        pass_filenames: false
        always_run: true

      - id: decisions-lint
        name: decisions-lint
        entry: scripts/decisions-lint
        language: script
        pass_filenames: false
        always_run: true

      - id: skill-lint
        name: skill-lint
        entry: scripts/skill-lint
        language: script
        pass_filenames: false
        always_run: true

      - id: judgments-lint
        name: judgments-lint
        entry: scripts/judgments-lint
        language: script
        pass_filenames: false
        always_run: true

      # Local-only: the standards/ tree it audits exists only in dev-playbook,
      # so standards-lint is not published in the manifest or the canonical
      # template (the validate-manifest precedent).
      - id: standards-lint
        name: standards-lint
        entry: scripts/standards-lint
        language: script
        pass_filenames: false
        always_run: true

      # Local-only: consumers have no hook manifest to validate.
      - id: validate-manifest
        name: validate-manifest
        entry: uvx pre-commit validate-manifest
        language: system
        files: ^\.pre-commit-hooks\.yaml$

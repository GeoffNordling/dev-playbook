repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: [--fix]
        exclude: project-template/|dotfiles/\.(agents|dhub)/
      - id: ruff-format
        exclude: project-template/|dotfiles/\.(agents|dhub)/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --directory tools mypy src/
        language: system
        pass_filenames: false
        types: [python]

# --- generated by tools/bin/generate-pre-commit ---
  - repo: local
    hooks:
      - id: ref-check
        name: ref-check
        entry: python3 tools/bin/ref-check .
        language: system
        pass_filenames: false
        types: ['markdown']
      - id: skill-audit
        name: skill-audit
        entry: python3 tools/bin/skill-audit
        language: system
        pass_filenames: false
        always_run: true
      - id: test-privacy
        name: test-privacy
        entry: python3 tools/bin/test-privacy sdd-tools/tests
        language: system
        pass_filenames: false
        always_run: true
# --- end generated ---

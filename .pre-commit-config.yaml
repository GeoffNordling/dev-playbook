repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: [--fix]
        exclude: deprecated/|project-template/|dotfiles/\.(agents|dhub)/
      - id: ruff-format
        exclude: deprecated/|project-template/|dotfiles/\.(agents|dhub)/

  - repo: local
    hooks:
      - id: internal-skill-audit
        name: internal-skill-audit
        entry: python3 tools/bin/internal-skill-audit
        language: system
        pass_filenames: false
        always_run: true
      - id: ref-check
        name: ref-check
        entry: python3 tools/bin/ref-check .
        language: system
        pass_filenames: false
        types: ['markdown']
      - id: test-privacy
        name: test-privacy
        entry: python3 tools/bin/test-privacy spec-tools/tests
        language: system
        pass_filenames: false
        always_run: true

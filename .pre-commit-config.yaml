# dev-playbook runs its own hooks from the working tree, so edits to the
# scripts/ hooks are testable in place before release. Consumer repos do NOT
# use this file — they reference the published manifest (.pre-commit-hooks.yaml)
# by URL + pinned rev. dev-playbook is the hook repo itself, so the canonical
# template's pinned dev-playbook block is replaced here by the `- repo: local`
# dogfood block below; it mirrors that manifest, so keep the two in sync.
# See standards/build/distribution.md.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # Externally-managed vendored trees, carried byte-identical to their
        # upstream pin. The authoritative list of roots is
        # src/dev_playbook/external.py (is_externally_managed); pre-commit
        # config cannot import Python, so this literal mirrors that source of
        # truth — keep the two in sync. See standards/shell/conventions.md.
        exclude: ^dotfiles/\.agents/
  - repo: https://github.com/maxwinterstein/shfmt-py
    rev: v4.0.0
    hooks:
      - id: shfmt
        # Same externally-managed roots as shellcheck above; the authority is
        # src/dev_playbook/external.py (is_externally_managed).
        exclude: ^dotfiles/\.agents/
  - repo: local
    hooks:
      - id: make-check
        name: make check-judgments-cache
        entry: make check-judgments-cache
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: playbook-lint
        name: playbook-lint
        entry: scripts/playbook-lint
        language: script
        pass_filenames: false
        always_run: true

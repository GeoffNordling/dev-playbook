# Doc-vs-code consistency judgments for dev-playbook. Each asks an LLM judge
# whether a document still accurately describes the code or workflow it
# documents -- a semantic drift guard the deterministic gate cannot check. The
# gate is green only once each judgment's current content has been
# judged-and-passed and recorded (see standards/judgments/).
judgments:
  - id: scatter-gather-recipe-matches-workflow
    claim: |
      harness-recipes/recipes/scatter-gather.md accurately documents the
      scatter-gather workflow script it describes.
    evidence:  [harness-recipes/recipes/scatter-gather.md]
    reference: [dotfiles/dot-claude/workflows/scatter-gather.js]
    model: claude-sonnet-4-6
    effort: high

  - id: judgments-standard-matches-loader
    claim: |
      standards/judgments/declarations.md accurately documents the judgment
      declaration format and the field rules that the judgments tooling
      validates.
    evidence:  [standards/judgments/declarations.md]
    reference: [src/dev_playbook/judgments/loader.py, src/dev_playbook/judgments/bench.py]
    model: claude-sonnet-4-6
    effort: high

  - id: run-judgments-skill-matches-tooling
    claim: |
      The run-judgments skill accurately documents how it dispatches
      cache-missed judgments through the scatter-gather workflow and records
      the passing verdicts.
    evidence:  [dotfiles/dot-claude/skills/run-judgments/SKILL.md]
    reference:
      - src/dev_playbook/judgments/runner.py
      - dotfiles/dot-claude/workflows/scatter-gather.js
    model: claude-opus-4-8
    effort: high

  - id: build-standard-matches-artifacts
    claim: |
      The standards/build/ documents promise exactly what ships: every
      concrete statement they make about the canonical artifacts in
      standards/build/canonical/ and about the published hook manifest
      (.pre-commit-hooks.yaml) — file names, hook ids, targets, commands,
      pins, entry paths — is true of those files as they exist today.
    evidence:
      - standards/build/index.md
      - standards/build/layers.md
      - standards/build/skeleton.md
      - standards/build/make.md
      - standards/build/python.md
      - standards/build/ci.md
      - standards/build/aws.md
      - standards/build/canonical.md
      - standards/build/distribution.md
      - standards/build/enforcement.md
    reference:
      - standards/build/canonical/Makefile.base
      - standards/build/canonical/Makefile.python
      - standards/build/canonical/Makefile.aws
      - standards/build/canonical/ci.yml
      - standards/build/canonical/pyproject.toml
      - standards/build/canonical/CLAUDE.md.standards
      - .pre-commit-hooks.yaml
    model: claude-opus-4-8
    effort: high

  - id: repo-audit-subset-of-standard
    claim: |
      scripts/repo-audit enforces only what the documented standard states:
      every check it performs corresponds to a requirement stated in the
      standards/build/ documents. The standard may state more than the tool
      checks; the tool must not check more than the standard states.
    evidence:  [scripts/repo-audit]
    reference:
      - standards/build/index.md
      - standards/build/layers.md
      - standards/build/skeleton.md
      - standards/build/make.md
      - standards/build/python.md
      - standards/build/ci.md
      - standards/build/aws.md
      - standards/build/canonical.md
      - standards/build/distribution.md
      - standards/build/enforcement.md
    model: claude-opus-4-8
    effort: high

  - id: standard-card-build
    claim: |
      standards/build.md is an honest card: every pointer in its define,
      audit, enforce, and adopt cells names a real artifact that genuinely
      serves that cell's role for the build standard, and no cell
      misrepresents what its targets do.
    evidence:  [standards/build.md]
    reference:
      - standards/standard/format.md
      - standards/build/index.md
      - standards/build/canonical.md
      - scripts/repo-audit
      - scripts/sweep
      - standards/build/canonical/.pre-commit-config.yaml
      - standards/build/canonical/Makefile.base
      - standards/build/canonical/ci.yml
    model: claude-opus-4-8
    effort: high

  - id: standard-card-standard
    claim: |
      standards/standard.md is an honest card: every pointer in its define,
      audit, enforce, and adopt cells names a real artifact that genuinely
      serves that cell's role for the meta-standard, and no cell
      misrepresents what its targets do.
    evidence:  [standards/standard.md]
    reference:
      - standards/standard/format.md
      - scripts/okf-lint
      - scripts/ref-check
      - judgments/doc-consistency.yaml
      - .pre-commit-config.yaml
    model: claude-opus-4-8
    effort: high

  - id: standard-card-claude-code
    claim: |
      standards/claude-code.md is an honest card: every pointer in its
      define, audit, enforce, and adopt cells names a real artifact that
      genuinely serves that cell's role for the Claude Code harness-files
      standard, and no cell misrepresents what its targets do.
    evidence:  [standards/claude-code.md]
    reference:
      - standards/standard/format.md
      - standards/claude-code/files.md
      - standards/claude-code/claude-content.md
      - standards/claude-code/skill-conventions.md
      - standards/claude-code/skill-management.md
      - scripts/repo-audit
      - scripts/internal-skill-audit
      - standards/build/canonical/.pre-commit-config.yaml
      - standards/build/canonical/CLAUDE.md.standards
    model: claude-opus-4-8
    effort: high

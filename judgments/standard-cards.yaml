# Card-honesty judgments for dev-playbook's standard cards (the meta-standard's
# per-card semantic check). Each puts one standard card on trial: an LLM judge
# rules whether the card is honest -- every pointer in its Define, Audit,
# Enforce, and Adopt cells names a real artifact that genuinely serves that
# cell's role, any cell that declares "none" is genuinely empty, and no cell
# misrepresents what its targets do. Evidence is the card under trial; reference
# is standards/standard/format.md (the card contract) plus the artifacts the
# card points at. One judgment per card -- semantic honesty the deterministic
# standards-lint cannot check. See standards/judgments/.
judgments:
  - id: standard-card-build
    claim: |
      standards/build.md is an honest card: every pointer in its define,
      audit, enforce, and adopt cells names a real artifact that genuinely
      serves that cell's role for the build standard, and no cell
      misrepresents what its targets do.
    evidence:  [standards/build.md]
    reference:
      - standards/standard/format.md
      - standards/build/index.md
      - standards/build/canonical.md
      - scripts/repo-lint
      - scripts/workspace-lint
      - standards/build/canonical/.pre-commit-config.yaml
      - standards/build/canonical/Makefile.base
      - standards/build/canonical/ci.yml
    model: claude-sonnet-5
    effort: high


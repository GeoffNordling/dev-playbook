# Artifact-on-trial conformance judgments for dev-playbook: an artifact is on
# trial against the document that governs it, and an LLM judge rules whether the
# artifact conforms to what the doc states. Evidence is the artifact under trial;
# reference is the governing document. This is the mirror of docs-match-code --
# there a doc is on trial against the code it describes; here the code is on
# trial against the doc that governs it. See standards/judgments/.
#
# Subset claim template. The subset judgments below share one shape: X does or
# contains only what Y states; Y may state more than X does; X must not exceed
# Y. The conformance is one-directional -- the artifact (X) may implement less
# than the document (Y) permits, but never more -- so the judge checks only that
# everything X does is sanctioned by Y, never that X covers all of Y.
#
# A multi-card detector is put on trial one subset judgment per card. repo-lint
# emits build.*, docs.*, and claude-code.* rules, so each card's rule-prefix
# slice is tried against that card's standard in its own judgment -- keeping any
# single judge's reference set small instead of one judgment over every card.
judgments:
  - id: repo-lint-build-subset-of-standard
    claim: |
      Every check scripts/repo-lint performs that emits a `build.` rule
      corresponds to a requirement stated in the standards/build/ documents.
      The standard may state more than the tool checks; the tool must not
      check more than the standard states. repo-lint is a multi-card
      detector -- its docs.* and claude-code.* checks are on trial in their
      own judgments, not here.
    evidence:  [scripts/repo-lint]
    reference:
      - standards/build/index.md
      - standards/build/layers.md
      - standards/build/skeleton.md
      - standards/build/make.md
      - standards/build/python.md
      - standards/build/ci.md
      - standards/build/aws.md
      - standards/build/canonical.md
      - standards/build/distribution.md
      - standards/build/enforcement.md
    model: claude-sonnet-5
    effort: high

  - id: repo-lint-docs-subset-of-standard
    claim: |
      Every check scripts/repo-lint performs that emits the
      `knowledge-organization.doc-shape` rule corresponds to a requirement
      stated in the standards/docs/ documents:
      the README H1 and the CONTEXT.md sections it checks for are shape
      requirements those documents state. The standard may state more than
      the tool checks; the tool must not check more than the standard states.
    evidence:  [scripts/repo-lint]
    reference:
      - standards/docs/readme-content.md
      - standards/docs/context-content.md
    model: claude-sonnet-5
    effort: high

  - id: repo-lint-claude-code-subset-of-standard
    claim: |
      Every check scripts/repo-lint performs that emits a `claude-code.`
      rule corresponds to a requirement stated in the referenced standards:
      the agent-facing voice of every CLAUDE.md and of every first-party
      agent definition, skill, and rule body, and the global file's
      two-section shape and
      required workspace-wide rules. The standards may state more than the
      tool checks; the tool must not check more than the standards state.
    evidence:  [scripts/repo-lint]
    reference:
      - standards/claude-code/claude-content.md
      - standards/prose/conventions.md
    model: claude-sonnet-5
    effort: high

  - id: scheme-vs-graph
    claim: |
      src/dev_playbook/label_scheme.json's factory dimensions — category, mode,
      tests, and phase — mint exactly the labels
      standards/tracking/factory-labels.md states: the fixed-value dimensions
      produce the labels of the doc's Valid labels table, and the phase
      dimension satisfies the doc's parity invariant — one value per work node
      of the graph in software-factory/software-factory.md, with `_` mapped to
      `-`, plus the retained values the invariant exempts and no others. Ignore
      any other dimension the scheme declares — it is outside this claim.
    evidence:  [src/dev_playbook/label_scheme.json]
    reference:
      - standards/tracking/factory-labels.md
      - software-factory/software-factory.md
    model: claude-sonnet-5
    effort: high

  - id: scheme-vs-tracker
    claim: |
      src/dev_playbook/label_scheme.json's wayfinder dimension mints exactly the
      labels standards/tracking/tracker-operations.md states in its Wayfinding
      operations section: the map label and the ticket types, and nothing else.
      The scheme declares no dimension beyond wayfinder, the factory's four —
      category, mode, tests, and phase — and origin, which is governed by
      standards/tracking/factory-labels.md's Valid labels section; one that is
      none of those violates this claim.
    evidence:  [src/dev_playbook/label_scheme.json]
    reference:
      - standards/tracking/tracker-operations.md
      - standards/tracking/factory-labels.md
    model: claude-sonnet-5
    effort: high

  - id: wayfinder-lint-mirrors-skill
    claim: |
      src/dev_playbook/workspace_lint.py's checks on the shape of a wayfinder
      map and a decision ticket restate only what the /wayfinder skill states:
      the map's body sections, the ticket's body section, the ticket types, and
      the map/ticket distinction. The skill may state more than the lint checks;
      the lint must not check more of their shape than the skill states. Ignore
      the lint's rule that a map or ticket carries no factory-dimension label —
      that comes from the tracking standard, not the skill.
    evidence:  [src/dev_playbook/workspace_lint.py]
    reference: [dotfiles/.agents/skills/wayfinder/SKILL.md]
    model: claude-sonnet-5
    effort: high

  - id: brief-headings-match-standard
    claim: |
      src/dev_playbook/workspace_lint.py's required-heading tuples for the
      tracking.issue-brief-shape audit name exactly the headings
      standards/tracking/issue-authoring.md states: BUILD_HEADINGS is the
      build-leaf brief's required headings, with the names and in the order
      the standard's build-leaf section gives them, and SPIKE_HEADINGS is the
      spike brief's. This one is exact agreement rather than the file's usual
      subset claim — neither tuple may omit a heading the standard requires,
      nor add one it does not, because the standard declares the tuples and
      its own lists to be one contract. A heading the standard marks optional
      or unenforced (Steps to reproduce) belongs in neither tuple.
    evidence:  [src/dev_playbook/workspace_lint.py]
    reference: [standards/tracking/issue-authoring.md]
    model: claude-sonnet-5
    effort: high

  - id: claude-md-subset
    claim: |
      dev-playbook's CLAUDE.md contains only content the claude-content
      contract permits: every kind of content in the file is one that
      standards/claude-code/claude-content.md sanctions for a repo's own
      injected CLAUDE.md — operating knowledge specific to this repo, and
      nothing that holds for every repo, since that belongs to the global
      file. The contract may permit more than this file uses; this file must
      not exceed it.
    evidence:  [CLAUDE.md]
    reference:
      - standards/claude-code/claude-content.md
    model: claude-sonnet-5
    effort: high

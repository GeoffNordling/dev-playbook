# Doc-on-trial drift guards for dev-playbook: a document is on trial against the
# code or workflow it describes, and an LLM judge rules whether the doc still
# accurately describes it. Evidence is the document under trial; reference is the
# code or workflow it documents. These are the semantic drift guards the
# deterministic gate cannot check -- a doc and its implementation share no bytes,
# so only a reader can tell when they have drifted apart. See standards/semantic-validation/.
judgments:
  - id: scatter-gather-recipe-matches-workflow
    claim: |
      harness-recipes/recipes/scatter-gather.md accurately documents the
      scatter-gather workflow script it describes.
    evidence:  [harness-recipes/recipes/scatter-gather.md]
    reference: [dotfiles/dot-claude/workflows/scatter-gather.js]
    model: claude-sonnet-5
    effort: high

  - id: ralph-loop-recipe-matches-workflow
    claim: |
      harness-recipes/recipes/ralph-loop.md accurately documents the ralph-loop
      workflow script it describes.
    evidence:  [harness-recipes/recipes/ralph-loop.md]
    reference: [dotfiles/dot-claude/workflows/ralph-loop.js]
    model: claude-sonnet-5
    effort: high

  - id: judgments-standard-matches-loader
    claim: |
      standards/semantic-validation/declarations.md accurately documents the judgment
      declaration format and the field rules that the judgments tooling
      validates.
    evidence:  [standards/semantic-validation/declarations.md]
    reference: [src/dev_playbook/judgments/loader.py, src/dev_playbook/judgments/bench.py]
    model: claude-sonnet-5
    effort: high

  - id: judgments-recipe-matches-workflow
    claim: |
      harness-recipes/recipes/judgments.md accurately documents the judgments
      workflow script it describes.
    evidence:  [harness-recipes/recipes/judgments.md]
    reference:
      - dotfiles/dot-claude/workflows/judgments.js
      - src/dev_playbook/judgments/runner.py
    model: claude-sonnet-5
    effort: high

  - id: judgments-sweep-skill-matches-tooling
    claim: |
      The judgments-sweep skill accurately documents how it plans a
      multi-root docket, dispatches it through the judgments workflow, what
      that workflow returns, and how the passing verdicts get recorded.
    evidence:
      - dotfiles/dot-claude/skills/judgments-sweep/SKILL.md
      - dotfiles/dot-claude/skills/judgments-sweep/references/recording-without-a-judge.md
    reference:
      - src/dev_playbook/judgments/runner.py
      - dotfiles/dot-claude/workflows/judgments.js
    model: claude-sonnet-5
    effort: high

  - id: build-standard-matches-artifacts
    claim: |
      The standards/build/ documents promise exactly what ships: every
      concrete statement they make about the canonical artifacts in
      standards/build/canonical/ and about the published hook manifest
      (.pre-commit-hooks.yaml) — file names, hook ids, targets, commands,
      pins, entry paths — is true of those files as they exist today.
    evidence:
      - standards/build/index.md
      - standards/build/layers.md
      - standards/build/skeleton.md
      - standards/build/make.md
      - standards/build/python.md
      - standards/build/ci.md
      - standards/build/aws.md
      - standards/build/canonical.md
      - standards/build/distribution.md
      - standards/build/enforcement.md
    reference:
      - standards/build/canonical/Makefile.base
      - standards/build/canonical/Makefile.python
      - standards/build/canonical/Makefile.aws
      - standards/build/canonical/ci.yml
      - standards/build/canonical/pyproject.toml
      - standards/build/canonical/.pre-commit-config.yaml
      - standards/build/canonical/.python-version
      - standards/build/canonical/.gitignore
      - .pre-commit-hooks.yaml
    model: claude-sonnet-5
    effort: high

  - id: script-responsibility
    claim: |
      scripts/README.md gives every script exactly one home and one job:
      each script appears in exactly one of the file's two tables (Validation
      scripts, Utility scripts) with a single stated responsibility, and each
      validation-table row additionally names one or more standards whose
      concerns the script's stated purpose serves, in a Standard column the
      utility table does not carry — a utility row states its purpose, and any
      standard it cites there is part of that purpose, not a binding of the
      script to that standard. The claim is over what the tables state, not
      their completeness.
    evidence:  [scripts/README.md]
    reference: [standards/index.md]
    model: claude-sonnet-5
    effort: high

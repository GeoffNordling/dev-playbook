name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v3
      - uses: pre-commit/action@v3.0.1
        env:
          # ref-check validates references to sibling repos under ~/workspace/.
          # The CI runner only checks out this repo, so cross-repo references
          # always resolve to non-existent paths. Local pre-commit is the
          # strict gate; skip ref-check here.
          SKIP: ref-check
      - run: make check
        working-directory: tools

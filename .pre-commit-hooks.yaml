# Canonical pre-commit hook definitions for the workspace.
#
# Consumer repos reference these by URL + pinned rev in their own
# .pre-commit-config.yaml, exactly as they reference any third-party hook:
#
#   - repo: https://github.com/GeoffNordling/dev-playbook
#     rev: <commit-sha>
#     hooks:
#       - id: repo-audit
#       - id: python-audit
#       - id: testing-audit
#       - id: ref-audit
#       - id: okf-audit
#       - id: skill-audit
#       - id: judgments-audit
#
# pre-commit clones this repo into its cache at the pinned rev and runs the
# hook from there, so resolution is independent of where the consumer repo —
# or any of its worktrees — sits on disk. The hook scripts live in scripts/
# and share primitives from src/dev_playbook/. See standards/build/distribution.md.

- id: repo-audit
  name: repo-audit
  entry: scripts/repo-audit
  language: script
  pass_filenames: false
  always_run: true

- id: python-audit
  name: python-audit
  entry: scripts/python-audit
  language: script
  pass_filenames: false
  always_run: true

- id: testing-audit
  name: testing-audit
  entry: scripts/testing-audit
  language: script
  pass_filenames: false
  always_run: true

- id: ref-audit
  name: ref-audit
  entry: scripts/ref-audit
  language: script
  pass_filenames: false
  types: [markdown]

- id: okf-audit
  name: okf-audit
  entry: scripts/okf-audit
  language: script
  pass_filenames: false
  always_run: true

- id: skill-audit
  name: skill-audit
  entry: scripts/skill-audit
  language: script
  pass_filenames: false
  always_run: true

- id: judgments-audit
  name: judgments-audit
  entry: scripts/judgments-audit
  language: script
  pass_filenames: false
  always_run: true

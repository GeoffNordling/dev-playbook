# Canonical pre-commit hook definition for the workspace.
#
# One published hook. Consumer repos reference it by URL + pinned rev in their
# own .pre-commit-config.yaml, exactly as they reference any third-party hook:
#
#   - repo: https://github.com/GeoffNordling/dev-playbook
#     rev: <commit-sha>
#     hooks:
#       - id: playbook-lint
#
# playbook-lint dispatches to every detector in its roster
# (src/dev_playbook/playbook_lint.py), so the manifest never grows and a
# detector added upstream reaches every consumer at its next pin bump — the
# consumer config enumerates nothing, and enrollment rides the pin by
# construction. pre-commit clones this repo into its cache at the pinned rev
# and runs the hook from there, so resolution is independent of where the
# consumer repo — or any of its worktrees — sits on disk. See
# standards/build/distribution.md.

- id: playbook-lint
  name: playbook-lint
  entry: scripts/playbook-lint
  language: script
  pass_filenames: false
  always_run: true

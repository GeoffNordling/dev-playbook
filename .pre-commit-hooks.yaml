# Canonical pre-commit hook definitions for the workspace.
#
# Consumer repos reference these by URL + pinned rev in their own
# .pre-commit-config.yaml, exactly as they reference any third-party hook:
#
#   - repo: https://github.com/GeoffNordling/dev-playbook
#     rev: <commit-sha>
#     hooks:
#       - id: python-lint
#       - id: ref-check
#       - id: okf-lint
#       - id: internal-skill-audit
#       - id: judgments-lint
#
# pre-commit clones this repo into its cache at the pinned rev and runs the
# hook from there, so resolution is independent of where the consumer repo —
# or any of its worktrees — sits on disk. The hook scripts live in tools/bin/
# and share primitives from tools/lib/. See standards/build/distribution.md.

- id: python-lint
  name: python-lint
  entry: tools/bin/python-lint
  language: script
  pass_filenames: false
  always_run: true

- id: ref-check
  name: ref-check
  entry: tools/bin/ref-check
  language: script
  pass_filenames: false
  types: [markdown]

- id: okf-lint
  name: okf-lint
  entry: tools/bin/okf-lint
  language: script
  pass_filenames: false
  always_run: true

- id: internal-skill-audit
  name: internal-skill-audit
  entry: tools/bin/internal-skill-audit
  language: script
  pass_filenames: false
  always_run: true

- id: judgments-lint
  name: judgments-lint
  entry: tools/bin/judgments-lint
  language: script
  pass_filenames: false
  always_run: true

# Canonical pre-commit hook definition for the workspace.
#
# One published hook. Consumer repos reference it by URL + pinned rev in their
# own .pre-commit-config.yaml, exactly as they reference any third-party hook:
#
#   - repo: https://github.com/GeoffNordling/dev-playbook
#     rev: <commit-sha>
#     hooks:
#       - id: playbook-check
#
# pre-commit installs this package into a venv it caches per pinned rev and
# runs the console script pyproject.toml declares. `playbook check` runs every
# check the package registers (src/dev_playbook/checks/), so the manifest never
# grows and a check added upstream reaches every consumer at its next pin bump
# — the consumer config enumerates nothing, and enrollment rides the pin by
# construction. Resolution is independent of where the consumer repo — or any
# of its worktrees — sits on disk. See standards/distribution/channel.md.
#
# The venv holds dev-playbook and nothing of the consumer's, so this hook runs
# dev-playbook's checks only. A consumer that writes its own checks runs them
# in a second hook of its own, `playbook-check-local`, which runs
# `playbook check --local` in the consumer's environment. That hook is not
# published here. See docs/decisions/0031-consumer-checks-run-in-a-local-hook.md.
#
# language_version names the interpreter pre-commit builds that venv with.
# Without it pre-commit uses whichever Python runs pre-commit itself, and a
# consumer's gate runs `uvx pre-commit`, whose tool environment is whatever
# Python uv prefers — 3.13 on the publishing machine — so the install of a
# package requiring 3.14 dies before any check runs. The version here is the
# floor pyproject.toml's requires-python states; move the two together, and
# with them the interpreter the canonical ci.yml installs on the runner, where
# nothing else puts a python3.14 on PATH for pre-commit to find.

- id: playbook-check
  name: playbook check
  entry: playbook check
  language: python
  language_version: python3.14
  pass_filenames: false
  always_run: true

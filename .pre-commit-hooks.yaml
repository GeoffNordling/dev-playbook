# Canonical pre-commit hook definition for the workspace.
#
# One published hook. Consumer repos reference it by URL + pinned rev in their
# own .pre-commit-config.yaml, exactly as they reference any third-party hook:
#
#   - repo: https://github.com/GeoffNordling/dev-playbook
#     rev: <commit-sha>
#     hooks:
#       - id: playbook-check
#
# pre-commit installs this package into a venv it caches per pinned rev and
# runs the console script pyproject.toml declares. `playbook check` runs every
# check the package registers (src/dev_playbook/checks/), so the manifest never
# grows and a check added upstream reaches every consumer at its next pin bump
# — the consumer config enumerates nothing, and enrollment rides the pin by
# construction. Resolution is independent of where the consumer repo — or any
# of its worktrees — sits on disk. See standards/distribution/channel.md.

- id: playbook-check
  name: playbook check
  entry: playbook check
  language: python
  pass_filenames: false
  always_run: true

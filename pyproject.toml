[project]
name = "dev-playbook"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",
]

# The measurement prototype's analysis stack, deliberately outside
# `dependencies`: consumer repos install this package for its linting hooks and
# must not pull pandas to get them. `uv sync --extra measure` opts in.
[project.optional-dependencies]
measure = [
    "pandas>=3.0",
    "plotly>=6.0",
]

# Console scripts so a consumer that installs this package resolves the
# judgments CLIs on its venv PATH. They wrap the same library entry points the
# scripts/ pre-commit shims call, so the two channels behave identically.
# `measure-timeline` has no scripts/ shim on purpose: it needs the `measure`
# extra, so it runs from the project venv (`uv run measure-timeline`) rather
# than from a self-bootstrapping `uv run --script` file.
[project.scripts]
judgments-run = "dev_playbook.judgments.runner:run_cli"
judgments-lint = "dev_playbook.judgments.loader:lint_cli"
measure-timeline = "dev_playbook.measure.cli:run_cli"

# uv's own build backend ships inside the uv binary, so building this package
# (including the editable build a consumer's `uv sync` runs) needs no network
# and no PyPI -- the single package is discovered at src/dev_playbook.
[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# Workspace-wide tooling that resolves from the repo root reads this table.
# The judgment gate collects every declaration in the judgments/*.yaml
# claim-family files; each passes iff its exact content-key is already cached
# (fill the cache with a run-judgments fleet run after editing a declaration or
# a file it puts on trial).
[tool.judgments]
paths = ["judgments/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ exposes the dev_playbook package; tests/ carries the bare-imported
# transcript_fakes and measure_fakes helpers that several suites pull in.
pythonpath = ["src", "tests"]

[dependency-groups]
# The self-reference pulls the `measure` extra in for development, so `make
# check` type-checks and tests the measurement modules against the real pandas
# rather than skipping them. Consumers installing the package are unaffected.
dev = [
    "dev-playbook[measure]",
    "mypy>=2.0",
    "pytest>=9.0",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py314"
line-length = 88
# Externally-managed vendored trees; ruff-pre-commit passes --force-exclude so
# this holds under the hook as well as under `uv run ruff`. The authoritative
# list of externally-managed roots is src/dev_playbook/external.py
# (is_externally_managed); ruff config cannot import Python, so this literal
# mirrors that source of truth — keep the two in sync.
extend-exclude = ["dotfiles/.agents"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "SLF", "D"]
# D401 (imperative-mood summaries) is excluded to keep the workspace's
# noun-phrase docstring voice.
ignore = ["E501", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Test functions carry no docstrings by convention (see python/style.md); the
# glob also covers a nested template scaffold's own tests/ tree. __init__.py
# stays empty, so D104 (missing package docstring) would contradict
# python.empty-init.
"**/tests/**" = ["D"]
"__init__.py" = ["D104"]

[tool.ruff.lint.isort]
known-first-party = ["dev_playbook"]

[tool.mypy]
python_version = "3.14"
mypy_path = ["src", "tests"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]

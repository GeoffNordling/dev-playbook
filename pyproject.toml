[project]
name = "dev-playbook"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",
]

# Console scripts so a consumer that installs this package resolves the
# judgments CLIs on its venv PATH. They wrap the same library entry points the
# scripts/ pre-commit shims call, so the two channels behave identically.
[project.scripts]
judgments-run = "dev_playbook.judgments.runner:run_cli"
judgments-lint = "dev_playbook.judgments.loader:lint_cli"

# uv's own build backend ships inside the uv binary, so building this package
# (including the editable build a consumer's `uv sync` runs) needs no network
# and no PyPI -- the single package is discovered at src/dev_playbook.
[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# Workspace-wide tooling that resolves from the repo root reads this table.
# The judgment gate collects every declaration in the judgments/*.yaml
# claim-family files; each passes iff its exact content-key is already cached
# (fill the cache with a run-judgments fleet run after editing a declaration or
# a file it puts on trial).
[tool.judgments]
paths = ["judgments/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ exposes the dev_playbook package; tests/ carries a bare-imported
# transcript_fakes helper two suites pull in.
pythonpath = ["src", "tests"]

[dependency-groups]
dev = [
    "mypy>=2.0",
    "pytest>=9.0",
    "ruff>=0.15.20",
]

[tool.ruff]
target-version = "py314"
line-length = 88
# Externally-managed vendored trees; ruff-pre-commit passes --force-exclude so
# this holds under the hook as well as under `uv run ruff`.
extend-exclude = ["dotfiles/.agents", "dotfiles/.dhub"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "SLF", "D"]
# D401 (imperative-mood summaries) is excluded to keep the workspace's
# noun-phrase docstring voice.
ignore = ["E501", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Test functions carry no docstrings by convention (see python/style.md); the
# glob also covers a nested template scaffold's own tests/ tree. __init__.py
# stays empty, so D104 (missing package docstring) would contradict
# python.empty-init.
"**/tests/**" = ["D"]
"__init__.py" = ["D104"]

[tool.ruff.lint.isort]
known-first-party = ["dev_playbook"]

[tool.mypy]
python_version = "3.14"
mypy_path = ["src", "tests"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disable_error_code = ["import-untyped"]

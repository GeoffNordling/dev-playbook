[project]
name = "spec-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["networkx>=3.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "req(id): spec-coverage marker linking the test to a `req~...` item",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "SLF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["spec_tools"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
disable_error_code = ["import-untyped"]
